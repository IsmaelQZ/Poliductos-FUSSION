<script>
  // Mide cuánto le falta a un elemento fixed para llegar al borde inferior real de la pantalla
  // (solo PWA instalada en vertical; ver --fixed-gap en css/styles.css).
  (function () {
    try {
      var standalone = navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
      var measure = function () {
        var gap = 0;
        if (standalone && innerHeight >= innerWidth) {
          gap = Math.round(Math.max(screen.width, screen.height) - innerHeight);
          if (gap < 0 || gap > 80) gap = 0;
        }
        document.documentElement.style.setProperty('--fixed-gap', gap + 'px');
      };
      measure();
      addEventListener('resize', measure);
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="css/styles.css">
</head>

<div id="splash" aria-hidden="true">
  <div class="splash-inner">
    <div class="splash-logo">
      <svg class="splash-svg" viewBox="-50 0 892 740" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <ellipse cx="396" cy="700" rx="245" ry="15" fill="url(#sg-ground)"/>
        <g filter="url(#sg-blur)" transform="translate(0 22)" opacity=".3"><use href="#lg-blue" fill="#0c0943"/><use href="#lg-orange" fill="#0c0943"/></g>
        <use href="#lg-blue" fill="url(#sg-blue)"/><use href="#lg-orange" fill="url(#sg-orange)"/>
        <use href="#lg-blue" fill="url(#sg-gloss)"/><use href="#lg-orange" fill="url(#sg-gloss)"/>
        <g clip-path="url(#sg-clip)"><g transform="skewX(-16)"><rect class="sg-shine" x="-300" y="0" width="200" height="740" fill="url(#sg-shine)"/></g></g>
      </svg>
    </div>
    <div class="splash-bar"><span></span></div>
    <div class="splash-text">Cargando rutas</div>
  </div>
</div>

<div class="app">
  <div id="map"></div>

  <header class="hud">
    <div class="hud-card">
      <svg class="hud-mark" viewBox="0 18 792 646" aria-hidden="true"><use href="#lg-blue" fill="url(#sg-blue)"/><use href="#lg-orange" fill="url(#sg-orange)"/></svg>
      <div class="hud-main">
        <div class="hud-eyebrow">Ruta del día</div>
        <div class="hud-select">
          <select id="routeSelect" aria-label="Elegir ruta"></select>
          <svg class="hud-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="sync-status" id="syncStatus">Actualizado: —</div>
      </div>
      <button id="syncBtn" class="hud-btn" type="button" aria-label="Actualizar datos" title="Actualizar datos">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v4.5h-4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="downloadBtn" class="hud-btn hud-btn-accent" type="button" aria-label="Descargar ruta para usar sin conexión" title="Descargar ruta sin conexión">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 19.5h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="status-banner loading" id="statusBanner"><span class="dot"></span> Calculando ruta por calles…</div>
  </header>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<div class="sheet" id="clientsSheet">
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet-panel">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="sheet-title" id="panelHead">Orden de visita</div>
      <button class="sheet-close" data-close>✕</button>
    </div>
    <div class="search-row">
      <input type="search" id="clientSearch" class="client-search" placeholder="Buscar cliente…" autocomplete="off">
    </div>
    <div id="stopsList"></div>
  </div>
</div>

<div class="sheet" id="infoSheet">
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet-panel">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="sheet-title" id="infoName">Cliente</div>
      <button class="sheet-close" data-close>✕</button>
    </div>
    <div id="infoPhone" class="info-phone"></div>
    <div id="infoPricing" class="info-pricing"></div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
